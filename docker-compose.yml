version: '3.8'

services:
  db:
    image: postgres:15
    container_name: personnel_db
    environment:
      POSTGRES_DB: personnel_management
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shoppassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - personnel_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: personnel_backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: personnel_management
      DB_USER: shop_user
      DB_PASSWORD: shoppassword123
      SERVER_PORT: 5000
      JWT_SECRET: your_secret_key_here
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - personnel_network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: personnel_frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - personnel_network

volumes:
  postgres_data:

networks:
  personnel_network:
    driver: bridge